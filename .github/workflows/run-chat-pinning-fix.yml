name: Run chat pinning fix
on:
  workflow_dispatch:
jobs:
  apply-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chat-character-pinning
      - name: Apply pinning fix to app.js and sw.js
        run: |
          python3 << 'PYEOF'
          import sys, subprocess
          N = chr(10)
          path = 'chloe-companion-app/js/app.js'
          with open(path, encoding='utf-8') as f:
              src = f.read()
          def rep(old, new, name):
              global src
              n = src.count(old)
              if n != 1:
                  print(f'FAIL {name}: found {n}x (expected 1x)')
                  sys.exit(1)
              src = src.replace(old, new, 1)
              print(f'OK {name}')
          rep("function addMsg(who, html, opts = {}) {",
              "/* Pin a caption to the character who sent it. Callers pass the speaker name" + N + "   explicitly so a reply that arrives after a character switch is still" + N + "   captioned with the right name (see sendMessage / sendPresetVideo). */" + N + "function herCaption(speakerName) {" + N + "  return (speakerName || currentGirl.name) + ' \u00b7 ' + timeNow();" + N + "}" + N + "function addMsg(who, html, opts = {}) {",
              "helper")
          rep("  wrap.appendChild(b);" + N + "  if (opts.caption) {",
              "  wrap.appendChild(b);" + N + "  // opts.speakerName pins the caption to the character who sent the message," + N + "  // even if currentGirl changed while the reply was in flight." + N + "  const caption = opts.caption || (opts.speakerName ? herCaption(opts.speakerName) : '');" + N + "  if (caption) {",
              "addMsg-caption")
          rep("    t.textContent = opts.caption;",
              "    t.textContent = caption;",
              "addMsg-textContent")
          rep("function addText(who, text, opts = {}) {",
              "function addText(who, text, opts = {}, speakerName) {",
              "addText-sig")
          rep("addMsg(who, esc(text), { caption: who === 'her' ? currentGirl.name + ' \u00b7 ' + timeNow() : timeNow() });",
              "addMsg(who, esc(text), { caption: who === 'her' ? herCaption(speakerName) : timeNow() });",
              "addText-caption")
          rep("function addPhotoDrop(url, caption) {" + N + "  const wrap = addMsg('her', '', { bubbleClass: 'photo-bubble', caption: currentGirl.name + ' \u00b7 ' + timeNow() });",
              "function addPhotoDrop(url, caption, speakerName) {" + N + "  const wrap = addMsg('her', '', { bubbleClass: 'photo-bubble', caption: herCaption(speakerName) });",
              "addPhotoDrop")
          rep('alt="Photo ${currentGirl.name} sent you"',
              'alt="Photo ${speakerName || currentGirl.name} sent you"',
              "addPhotoDrop-alt")
          rep("function addGeneratedImage(url) {" + N + "  const wrap = addMsg('her', '', { bubbleClass: 'photo-bubble', caption: currentGirl.name + ' \u00b7 ' + timeNow() });",
              "function addGeneratedImage(url, speakerName) {" + N + "  const wrap = addMsg('her', '', { bubbleClass: 'photo-bubble', caption: herCaption(speakerName) });",
              "addGeneratedImage")
          rep("function addAttachments(who, attachments) {",
              "function addAttachments(who, attachments, speakerName) {",
              "addAttachments-sig")
          rep("caption: who === 'her' ? currentGirl.name + ' \u00b7 ' + timeNow() : timeNow(),",
              "caption: who === 'her' ? herCaption(speakerName) : timeNow(),",
              "addAttachments-caption")
          rep("let sending = false;",
              "let sending = false;" + N + "let presetSheetGirl = null;",
              "presetSheetGirl-decl")
          rep("  const targetCharacterId = currentGirl.id;",
              "  const targetCharacterId = currentGirl.id;" + N + "  const targetCharacterName = currentGirl.name;",
              "sendMessage-capture")
          rep("  if (res.voice_note_url) {" + N + "    addVoiceNote(res.voice_note_url, res.reply_text);" + N + "  } else {" + N + "    addText('her', res.reply_text || '\u2026');" + N + "  }" + N + "  if (res.photo_url) addPhotoDrop(res.photo_url, res.photo_caption || '');" + N + "  if (res.image_url) addGeneratedImage(res.image_url);" + N + "  if (res.sogni_login_box) addSogniLoginButton();",
              "  if (currentGirl.id !== targetCharacterId) {" + N + "    // She replied while another chat was open: don't paint her reply into" + N + "    // the wrong thread. The reply is already saved in her own history." + N + "    showToast(targetCharacterName + ' replied in her chat', 3200);" + N + "  } else {" + N + "    if (res.voice_note_url) {" + N + "      addVoiceNote(res.voice_note_url, res.reply_text);" + N + "    } else {" + N + "      addText('her', res.reply_text || '\u2026', {}, targetCharacterName);" + N + "    }" + N + "    if (res.photo_url) addPhotoDrop(res.photo_url, res.photo_caption || '', targetCharacterName);" + N + "    if (res.image_url) addGeneratedImage(res.image_url, targetCharacterName);" + N + "    if (res.sogni_login_box) addSogniLoginButton();" + N + "  }",
              "sendMessage-guard")
          rep("$('plusBtn').addEventListener('click', async () => {" + N + "  const list = $('presetList');",
              "$('plusBtn').addEventListener('click', async () => {" + N + "  presetSheetGirl = { id: currentGirl.id, name: currentGirl.name };" + N + "  const list = $('presetList');",
              "plusBtn-capture")
          rep("const r = await fetch('/api/v1/give-presets/' + encodeURIComponent(currentGirl.id));",
              "const r = await fetch('/api/v1/give-presets/' + encodeURIComponent(presetSheetGirl.id));",
              "plusBtn-fetch")
          rep("presets = PRESETS[currentGirl.id] || [];",
              "presets = PRESETS[presetSheetGirl.id] || [];",
              "plusBtn-presets")
          rep("list.innerHTML = '<div class=\"sheet-sub\">No presets yet for ' + currentGirl.name + '.</div>';",
              "list.innerHTML = '<div class=\"sheet-sub\">No presets yet for ' + presetSheetGirl.name + '.</div>';",
              "plusBtn-nopresets")
          rep("  const res = await ApiClient.requestPreset(currentGirl.id, presetName);",
              "  const girl = presetSheetGirl || { id: currentGirl.id, name: currentGirl.name };" + N + "  const res = await ApiClient.requestPreset(girl.id, presetName);",
              "sendPresetVideo-girl")
          rep("    addPresetMediaBubble(res.video_url, res.media_type || 'video', presetName);",
              "    addPresetMediaBubble(res.video_url, res.media_type || 'video', presetName, girl.name);",
              "sendPresetVideo-bubble")
          rep("    addText('her', 'let me find that for you\u2026 one sec');",
              "    addText('her', 'let me find that for you\u2026 one sec', {}, girl.name);",
              "sendPresetVideo-fallback")
          rep("  addText('her', 'hmm, couldn\\'t pull that one up. try again?');",
              "  addText('her', 'hmm, couldn\\'t pull that one up. try again?', {}, girl.name);",
              "sendPresetVideo-error")
          rep("function addPresetMediaBubble(url, mediaType, presetName) {" + N + "  const wrap = addMsg('her', '', {" + N + "    bubbleClass: 'photo-bubble'," + N + "    caption: currentGirl.name + ' \u00b7 ' + timeNow()," + N + "  });",
              "function addPresetMediaBubble(url, mediaType, presetName, speakerName) {" + N + "  const wrap = addMsg('her', '', {" + N + "    bubbleClass: 'photo-bubble'," + N + "    caption: herCaption(speakerName)," + N + "  });",
              "addPresetMediaBubble")
          with open(path, 'w', encoding='utf-8') as f:
              f.write(src)
          print('All app.js replacements applied')
          path = 'chloe-companion-app/sw.js'
          with open(path, encoding='utf-8') as f:
              src = f.read()
          old = "const CACHE = 'whispr-pwa-v1';"
          new = "const CACHE = 'whispr-pwa-v2-20261017';"
          if src.count(old) != 1:
              print(f'FAIL sw.js cache: found {src.count(old)}x')
              sys.exit(1)
          src = src.replace(old, new, 1)
          with open(path, 'w', encoding='utf-8') as f:
              f.write(src)
          print('OK sw.js cache')
          r = subprocess.run(['node', '--check', 'chloe-companion-app/js/app.js'], capture_output=True, text=True)
          if r.returncode != 0:
              print('SYNTAX ERROR:')
              print(r.stderr)
              sys.exit(1)
          print('OK syntax check')
          PYEOF
      - name: Commit and push fix
        run: |
          git config user.name "mtthewwestfall"
          git config user.email "mtthewwestfall@users.noreply.github.com"
          git rm -q .github/workflows/apply-chat-pinning-fix.yml || true
          git add chloe-companion-app/js/app.js chloe-companion-app/sw.js
          git commit -m "Pin chat replies and gives to the character they were sent to [skip ci]"
          git push origin fix/chat-character-pinning
