name: Apply in-scene no-meta fix

# Temporary one-shot workflow: applies the in-scene no-meta code changes to
# chloe-companion-server/app/brain.py and
# chloe-companion-server/app/capability_hooks.py, commits them, then deletes
# itself so the branch diff contains only the two app files.

on:
  push:
    branches: [fix/no-roleplay-mentions-in-scene]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          ref: fix/no-roleplay-mentions-in-scene

      - name: Apply the in-scene fix
        run: |
          python3 - <<'PYEOF'
          import py_compile
          import sys

          BRAIN = "chloe-companion-server/app/brain.py"
          HOOKS = "chloe-companion-server/app/capability_hooks.py"

          with open(BRAIN, encoding="utf-8") as f:
              brain = f.read()

          # Idempotency: if the fix is already present, do nothing.
          if "IN_SCENE_NO_META_RULE" in brain:
              print("Fix already applied; nothing to do.")
              sys.exit(0)

          def replace_once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  print("ANCHOR FAILED [%s]: found %d occurrences, expected 1" % (label, n))
                  sys.exit(1)
              return text.replace(old, new, 1)

          # 1. brain.py _gemini_system_text: compute in_scene; when in a scene,
          # skip capability_hooks.hook_parts(...) but keep HONESTY_RULE.
          old1 = "    parts.extend([HONESTY_RULE] + capability_hooks.hook_parts(cid, char))"
          new1 = (
              "    # 2026-10-17: while a roleplay scene is active (or the roleplay lock\n"
              "    # is on), skip the capability hook parts -- they mention roleplay and\n"
              "    # break immersion. HONESTY_RULE is always kept.\n"
              "    in_scene = (context.get(\"scene_state\") == \"active\") or bool(context.get(\"roleplay_locked\"))\n"
              "    if in_scene:\n"
              "        parts.append(HONESTY_RULE)\n"
              "    else:\n"
              "        parts.extend([HONESTY_RULE] + capability_hooks.hook_parts(cid, char))"
          )
          brain = replace_once(brain, old1, new1, "hook_parts skip")

          # 2. Append IN_SCENE_NO_META_RULE right after the scene brief block so
          # it has recency while the scene is active (not for rocky).
          old2 = "            parts.append(block)\n    if cid == \"rocky\":"
          new2 = (
              "            parts.append(block)\n"
              "            # 2026-10-17: in-scene meta ban, placed right after the scene\n"
              "            # brief so it has recency while the scene is active.\n"
              "            if in_scene and cid != \"rocky\":\n"
              "                parts.append(IN_SCENE_NO_META_RULE)\n"
              "    if cid == \"rocky\":"
          )
          brain = replace_once(brain, old2, new2, "scene brief append")

          # 3. Define IN_SCENE_NO_META_RULE just before SCENE_NARRATION_RULE
          # (i.e. right after the other ROLEPLAY_* constants).
          rule = """IN SCENE \u2014 NO META: you are inside the scene right now. Never use the words 'roleplay' or 'role play' in your replies, and never refer to 'the scene', 'the setup', 'playing a part/character', or the fact that any of this is pretend or acting. There is no frame to reference \u2014 you are simply there, as her/him, first person, present tense. If he says something that steps outside the scene, answer as the person you are in the scene would answer. The ban on the word lasts until the scene ends or he uses the release word."""
          new_const = 'IN_SCENE_NO_META_RULE = """' + rule + '"""\n\n\n'
          old3 = "SCENE_NARRATION_RULE = "
          brain = replace_once(brain, old3, new_const + old3, "constant definition")

          with open(BRAIN, "w", encoding="utf-8") as f:
              f.write(brain)

          # 4. capability_hooks._maybe_hook: never inject a hook line while a
          # scene is active or the roleplay lock is on; return draft unchanged.
          with open(HOOKS, encoding="utf-8") as f:
              hooks = f.read()
          old4 = '    if brain._detect_intent(user_text or "") != "greet":'
          new4 = (
              "    # 2026-10-17: never inject a hook line while a roleplay scene is\n"
              "    # active or the roleplay lock is on -- return the draft unchanged.\n"
              "    if context.get(\"scene_state\") == \"active\" or context.get(\"roleplay_locked\"):\n"
              "        return draft\n"
              + old4
          )
          hooks = replace_once(hooks, old4, new4, "_maybe_hook guard")
          with open(HOOKS, "w", encoding="utf-8") as f:
              f.write(hooks)

          # Syntax-check both files.
          py_compile.compile(BRAIN, doraise=True)
          py_compile.compile(HOOKS, doraise=True)
          print("All edits applied; both files compile.")
          PYEOF

      - name: Commit, remove this workflow, and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/apply-in-scene-fix.yml
          git add chloe-companion-server/app/brain.py chloe-companion-server/app/capability_hooks.py
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Stop characters bringing up roleplay while a roleplay is running"
          git push origin fix/no-roleplay-mentions-in-scene
