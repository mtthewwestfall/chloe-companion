<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Whispr Admin</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, sans-serif; background: #0a0a0f; color: #fff; margin: 0; padding: 20px; }
  h1 { font-size: 24px; margin-bottom: 4px; }
  .sub { color: #888; font-size: 13px; margin-bottom: 20px; }
  .login-box { max-width: 400px; margin: 60px auto; text-align: center; }
  .login-box input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #333; background: #1a1a20; color: #fff; font-size: 15px; }
  .login-box button { width: 100%; padding: 12px; border-radius: 10px; border: none; background: linear-gradient(135deg,#ff4d8d,#a855f7); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .tab { padding: 10px 20px; border-radius: 10px; border: 1px solid #333; background: #1a1a20; color: #aaa; cursor: pointer; font-size: 14px; }
  .tab.active { background: linear-gradient(135deg,#ff4d8d,#a855f7); color: #fff; border-color: transparent; }
  .girl-card { background: #1a1a20; border: 1px solid #333; border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  .girl-name { font-size: 18px; font-weight: 700; margin-bottom: 12px; text-transform: capitalize; }
  .media-section { margin-bottom: 14px; }
  .media-title { font-size: 13px; color: #ff4d8d; font-weight: 700; margin-bottom: 8px; text-transform: uppercase; }
  .media-item { display: flex; align-items: center; gap: 8px; padding: 8px; background: #0a0a0f; border-radius: 8px; margin-bottom: 6px; font-size: 12px; }
  .media-item .url { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #888; }
  .media-item button { padding: 6px 12px; border-radius: 6px; border: none; background: #ff4444; color: #fff; cursor: pointer; font-size: 12px; }
  .add-form { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .add-form input, .add-form select { padding: 8px 10px; border-radius: 8px; border: 1px solid #333; background: #0a0a0f; color: #fff; font-size: 13px; }
  .add-form input[type="text"] { flex: 1; min-width: 200px; }
  .add-form button { padding: 8px 16px; border-radius: 8px; border: none; background: #51cf66; color: #fff; cursor: pointer; font-size: 13px; font-weight: 600; }
  .add-girl { background: #1a1a20; border: 1px dashed #555; border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  .add-girl input { padding: 10px; border-radius: 8px; border: 1px solid #333; background: #0a0a0f; color: #fff; font-size: 14px; margin-right: 8px; }
  .add-girl button { padding: 10px 20px; border-radius: 8px; border: none; background: linear-gradient(135deg,#ff4d8d,#a855f7); color: #fff; cursor: pointer; font-weight: 600; }
  .hidden { display: none; }
  .preset-tag { background: #2a2a35; padding: 2px 8px; border-radius: 4px; font-size: 11px; color: #ff4d8d; }
  .stage-tag { background: #1a3a5c; padding: 2px 8px; border-radius: 4px; font-size: 11px; color: #6ab0ff; }
  .stage-btns { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
  .stage-btn { padding: 4px 10px; border-radius: 6px; border: 1px solid #444; background: #222; color: #aaa; cursor: pointer; font-size: 11px; }
  .stage-btn.active { background: linear-gradient(135deg,#ff4d8d,#a855f7); color: #fff; border-color: transparent; }
  .media-preview { width: 100%; max-height: 200px; border-radius: 8px; margin-bottom: 6px; background: #000; }
  .filter-bar { display: flex; gap: 8px; margin-bottom: 12px; }
  .filter-btn { padding: 8px 16px; border-radius: 8px; border: 1px solid #444; background: #222; color: #aaa; cursor: pointer; font-size: 13px; }
  .filter-btn.active { background: #ff4d8d; color: #fff; border-color: transparent; }
  .acct-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .acct-table th { text-align: left; padding: 8px; color: #888; font-size: 11px; text-transform: uppercase; border-bottom: 1px solid #333; }
  .acct-table td { padding: 10px 8px; border-bottom: 1px solid #222; }
  .tier-badge { padding: 3px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
  .tier-basic { background: #2a2a35; color: #aaa; }
  .tier-plus { background: #1a3a5c; color: #6ab0ff; }
  .tier-vip { background: linear-gradient(135deg,#ff4d8d,#a855f7); color: #fff; }
  .grant-btn { padding: 6px 12px; border-radius: 6px; border: 1px solid #51cf66; background: transparent; color: #51cf66; cursor: pointer; font-size: 12px; margin-right: 4px; }
  .grant-btn:hover { background: #51cf66; color: #000; }
  .verified { color: #51cf66; } .unverified { color: #ff6b6b; }
</style>
</head>
<body>
<div id="loginView" class="login-box">
  <h1>Whispr Admin</h1>
  <p class="sub">Companion app management</p>
  <input type="password" id="adminToken" placeholder="Admin token">
  <button onclick="login()">Enter</button>
</div>

<div id="mainView" class="hidden">
  <h1>Whispr Admin</h1>
  <p class="sub">Manage characters, gives, mains, typing, activities</p>

  <div class="tabs">
    <button class="tab active" onclick="showTab('media')">Media Library</button>
    <button class="tab" onclick="showTab('girls')">Characters</button>
    <button class="tab" onclick="showTab('accounts')">Accounts</button>
  </div>

  <div id="tab-media">
    <div class="filter-bar">
      <button class="filter-btn active" onclick="setMediaFilter('untagged')">Untagged</button>
      <button class="filter-btn" onclick="setMediaFilter('all')">All</button>
    </div>
    <div style="color:#888;font-size:12px;margin-bottom:12px;">Stages: 1=lift tease · 2=shirt off · 3=boob grabs · 4=nipple pinch · 5=pants off · 6=plays with herself · 7=oral · 8=sex</div>
    <div id="mediaList"></div>
  </div>

  <div id="tab-girls" class="hidden">
    <div class="add-girl">
      <input id="newGirlId" placeholder="girl id (e.g. luna)">
      <input id="newGirlName" placeholder="Display name">
      <button onclick="addGirl()">Add Character</button>
    </div>
    <div id="girlList"></div>
  </div>

  <div id="tab-accounts" class="hidden">
    <div class="girl-card">
      <div class="girl-name">Signed Up Accounts</div>
      <table class="acct-table">
        <thead><tr><th>Name / Email</th><th>Plan</th><th>Msgs</th><th>Verified</th><th>Grant Free Month</th></tr></thead>
        <tbody id="acctBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const API = 'https://lockeddoor.ai';
let token = localStorage.getItem('whispr_admin_token') || '';

function login() {
  token = document.getElementById('adminToken').value;
  localStorage.setItem('whispr_admin_token', token);
  document.getElementById('loginView').classList.add('hidden');
  document.getElementById('mainView').classList.remove('hidden');
  loadMedia();
  loadGirls();
}

if (token) {
  document.getElementById('loginView').classList.add('hidden');
  document.getElementById('mainView').classList.remove('hidden');
  loadMedia();
  loadGirls();
}

function showTab(t) {
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('tab-media').classList.toggle('hidden', t !== 'media');
  document.getElementById('tab-girls').classList.toggle('hidden', t !== 'girls');
  document.getElementById('tab-accounts').classList.toggle('hidden', t !== 'accounts');
  if (t === 'accounts') loadAccounts();
}

async function api(method, path, body) {
  const res = await fetch(API + path, {
    method,
    headers: { 'Content-Type': 'application/json', 'X-Admin-Token': token },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 403) { alert('Invalid admin token'); localStorage.removeItem('whispr_admin_token'); location.reload(); }
  return res.json();
}

let mediaFilter = 'untagged';
let allMedia = [];

function setMediaFilter(f) {
  mediaFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderMedia();
}

const STAGE_NAMES = {1:'lift tease',2:'shirt off',3:'boob grabs',4:'nipple pinch',5:'pants off',6:'plays with herself',7:'oral',8:'sex'};

async function loadMedia() {
  const data = await api('GET', '/api/v1/admin/girl-media');
  allMedia = data.media || [];
  renderMedia();
}

function renderMedia() {
  const byGirl = {};
  allMedia.forEach(m => {
    if (mediaFilter === 'untagged' && m.kind === 'give' && (m.stage || 0) > 0) return;
    if (!byGirl[m.girl_id]) byGirl[m.girl_id] = { give: [], main: [], typing: [], activity: [] };
    byGirl[m.girl_id][m.kind].push(m);
  });
  const html = Object.keys(byGirl).sort().map(girl => {
    const sections = ['give', 'main', 'typing', 'activity'].map(kind => {
      const items = byGirl[girl][kind].map(m => {
        const isVideo = m.url.match(/\.(mp4|mov|webm)/i);
        const preview = isVideo
          ? `<video class="media-preview" src="${m.url}" muted playsinline preload="metadata" onclick="this.paused?this.play():this.pause()"></video>`
          : `<img class="media-preview" src="${m.url}">`;
        const stageBtns = kind === 'give' ? `<div class="stage-btns">${[1,2,3,4,5,6,7,8].map(s =>
          `<button class="stage-btn ${(m.stage||0)===s?'active':''}" onclick="setStage(${m.id},${s})">${s}</button>`
        ).join('')}</div>` : '';
        return `<div class="media-item" style="flex-direction:column;align-items:stretch;">
          ${preview}
          <div style="display:flex;align-items:center;gap:8px;">
            <span class="url">${m.url.split('/').pop()}</span>
            ${(m.stage||0)>0?`<span class="stage-tag">${STAGE_NAMES[m.stage]}</span>`:''}
            ${m.preset ? `<span class="preset-tag">${m.preset}</span>` : ''}
            <button onclick="delMedia(${m.id})">Delete</button>
          </div>${stageBtns}</div>`;
      }).join('');
      return `<div class="media-section"><div class="media-title">${kind === 'typing' ? 'Typing Main' : kind + 's'} (${byGirl[girl][kind].length})</div>${items || '<div style="color:#555;font-size:12px;">none</div>'}
        <div class="add-form">
          <input type="text" id="url-${girl}-${kind}" placeholder="Video/image URL">
          ${kind === 'give' ? `<input type="text" id="preset-${girl}-${kind}" placeholder="preset (e.g. love)" style="max-width:120px;">` : ''}
          <button onclick="addMedia('${girl}','${kind}')">+ Add</button>
        </div></div>`;
    }).join('');
    return `<div class="girl-card"><div class="girl-name">${girl}</div>${sections}</div>`;
  }).join('');
  document.getElementById('mediaList').innerHTML = html || '<p style="color:#888;">All tagged! 🎉</p>';
}

async function setStage(id, stage) {
  await api('PATCH', `/api/v1/admin/girl-media/${id}`, { stage });
  const m = allMedia.find(x => x.id === id);
  if (m) m.stage = stage;
  renderMedia();
}

async function addMedia(girl, kind) {
  const url = document.getElementById(`url-${girl}-${kind}`).value.trim();
  if (!url) return alert('Enter a URL');
  const preset = kind === 'give' ? (document.getElementById(`preset-${girl}-${kind}`).value.trim() || 'love') : '';
  await api('POST', '/api/v1/admin/girl-media', { girl_id: girl, kind, url, preset });
  loadMedia();
}

async function delMedia(id) {
  if (!confirm('Delete this?')) return;
  await api('DELETE', `/api/v1/admin/girl-media/${id}`);
  loadMedia();
}

async function loadGirls() {
  const data = await api('GET', '/api/v1/admin/girls');
  const girls = data.girls || data || [];
  document.getElementById('girlList').innerHTML = girls.map(g =>
    `<div class="girl-card"><div class="girl-name">${g.name || g.id}</div><div style="color:#888;font-size:13px;">ID: ${g.id}</div></div>`
  ).join('');
}

async function addGirl() {
  const id = document.getElementById('newGirlId').value.trim().toLowerCase();
  const name = document.getElementById('newGirlName').value.trim();
  if (!id || !name) return alert('Enter id and name');
  await api('POST', '/api/v1/admin/girls', { id, name });
  document.getElementById('newGirlId').value = '';
  document.getElementById('newGirlName').value = '';
  loadGirls();
  loadMedia();
}

async function loadAccounts() {
  const data = await api('GET', '/api/v1/admin/accounts');
  const rows = (data.accounts || []).map(a => {
    const tier = (a.tier || 'basic').toLowerCase();
    return `<tr>
      <td><div style="font-weight:600;">${a.name || '—'}</div><div style="color:#888;font-size:11px;">${a.email || a.user_id}</div></td>
      <td><span class="tier-badge tier-${tier}">${tier}</span></td>
      <td>${a.messages_remaining ?? '—'}</td>
      <td>${a.email_verified_at ? '<span class="verified">✓</span>' : '<span class="unverified">✗</span>'}</td>
      <td>
        <button class="grant-btn" onclick="grantMonth('${a.user_id}','basic')">Basic</button>
        <button class="grant-btn" onclick="grantMonth('${a.user_id}','plus')">Plus</button>
        <button class="grant-btn" onclick="grantMonth('${a.user_id}','vip')">VIP</button>
      </td>
    </tr>`;
  }).join('');
  document.getElementById('acctBody').innerHTML = rows || '<tr><td colspan="5" style="color:#888;">No accounts yet</td></tr>';
}

async function grantMonth(userId, tier) {
  if (!confirm(`Grant 1 free month of ${tier.toUpperCase()} to this account?`)) return;
  const res = await api('POST', '/api/v1/admin/grant-month', { user_id: userId, tier });
  if (res.ok) { alert(`Granted! Expires ${res.vip_expires_at}`); loadAccounts(); }
}
</script>
</body>
</html>
