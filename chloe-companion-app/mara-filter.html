<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mara Filter — Live Face Morph</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, system-ui, sans-serif; background:#0b0b10; color:#f2f2f5;
         display:flex; flex-direction:column; align-items:center; min-height:100vh; }
  header { padding:14px 16px 6px; text-align:center; }
  header h1 { font-size:20px; margin:0; font-weight:700; letter-spacing:.2px; }
  header p { margin:4px 0 0; font-size:13px; color:#a7a7b3; }
  #stage { position:relative; width:min(96vw, 880px); margin:10px auto 0; }
  canvas { width:100%; height:auto; display:block; border-radius:14px; background:#16161d; }
  #status { position:absolute; left:10px; top:10px; background:rgba(0,0,0,.6); padding:5px 10px;
            border-radius:999px; font-size:12px; color:#ffd9ec; max-width:92%; }
  .bar { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-items:center;
         padding:14px 12px 20px; width:min(96vw, 880px); }
  button { background:#e84393; color:#fff; border:0; border-radius:999px; padding:11px 18px;
           font-size:15px; font-weight:600; cursor:pointer; }
  button.ghost { background:#23232e; color:#f2f2f5; }
  button:disabled { opacity:.45; cursor:default; }
  label { font-size:13px; color:#a7a7b3; display:flex; align-items:center; gap:8px; }
  input[type=range] { width:150px; accent-color:#e84393; }
  .hint { font-size:12px; color:#77778a; text-align:center; padding:0 16px 18px; max-width:640px; }
  /* iOS Safari refuses to play display:none video — keep it technically visible */
  #cam { position:absolute; width:2px; height:2px; opacity:0.01; pointer-events:none; left:0; top:0; }
</style>
</head>
<body>
<header>
  <h1>💜 Mara Filter</h1>
  <p>Live face morph v3 — mesh warp, and her mouth opens when yours does. Runs entirely in your browser; nothing is uploaded.</p>
</header>

<div id="stage">
  <canvas id="view" width="960" height="720"></canvas>
  <div id="status">Tap “Start camera”</div>
</div>

<div class="bar">
  <button id="startBtn">📷 Start camera</button>
  <button id="flipBtn" class="ghost" disabled>🔄 Flip</button>
  <label>Morph strength <input id="strength" type="range" min="0" max="100" value="85"></label>
  <button id="snapBtn" class="ghost" disabled>📸 Snapshot</button>
  <button id="recBtn" class="ghost" disabled>⏺ Record</button>
</div>
<p class="hint">Best in good light, facing the camera. If the camera won't start, check the message above the video —
it says exactly what went wrong.</p>

let stream = null, facing = 'user', running = false;
let faceMesh = null, fmBusy = false, fmFailed = false;
let smooth = null, lastSeen = 0, latestLm = null, lmSmooth = null, lastDstPts = null, openSmooth = 0;

function setStatus(t){ statusEl.textContent = t; }

function initFaceMesh() {
  if (faceMesh || fmFailed) return;
  try {
    if (typeof FaceMesh === 'undefined') throw new Error('tracker script did not load');
    faceMesh = new FaceMesh({ locateFile: f =>
      'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/' + f });
    faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: false,
      minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    faceMesh.onResults(res => {
      fmBusy = false;
      latestLm = (res.multiFaceLandmarks && res.multiFaceLandmarks[0]) || null;
      if (latestLm) lastSeen = performance.now();
    });
  } catch (e) {
    fmFailed = true;
    setStatus('Face tracking unavailable (' + e.message + ') — plain camera still works');
  }
}

function drawFrame() {
  if (!running) return;
  const W = canvas.width, H = canvas.height;
  if (video.readyState >= 2) {
    ctx.save();
    ctx.translate(W, 0); ctx.scale(-1, 1);           // selfie mirror
    ctx.drawImage(video, 0, 0, W, H);
    if (latestLm) {
      const lm = latestLm;
      const p = i => ({ x: lm[i].x * W, y: lm[i].y * H });
      const mid = (a,b) => ({ x:(a.x+b.x)/2, y:(a.y+b.y)/2 });
      const anchors = { e1: mid(p(33), p(133)), e2: mid(p(362), p(263)), chin: p(152) };
      if (!smooth) smooth = anchors;
      const sa = 0.45;
      for (const k of ['e1','e2','chin']) {
        smooth[k].x += (anchors[k].x - smooth[k].x) * sa;
        smooth[k].y += (anchors[k].y - smooth[k].y) * sa;
      }
      // global affine: Mara texture anchors -> user's smoothed anchors
      const sA = { x: SRC.e1.x * MESH.texW, y: SRC.e1.y * MESH.texH };
      const sB = { x: SRC.e2.x * MESH.texW, y: SRC.e2.y * MESH.texH };
      const sC = { x: SRC.chin.x * MESH.texW, y: SRC.chin.y * MESH.texH };
      const g = affineFrom([sA, sB, sC], [smooth.e1, smooth.e2, smooth.chin]);
      if (!lmSmooth) lmSmooth = {};
      const dstPts = MESH.pts.map((pt, idx) => {
        const li = MESH.lm[idx];
        if (li >= 0) {
          const raw = p(li);
          const prev = lmSmooth[li];
          if (prev) { raw.x += (prev.x - raw.x) * 0.0; // placeholder keeps structure simple
          }
          if (!lmSmooth[li]) lmSmooth[li] = { x: raw.x, y: raw.y };
          lmSmooth[li].x += (raw.x - lmSmooth[li].x) * 0.5;
          lmSmooth[li].y += (raw.y - lmSmooth[li].y) * 0.5;
          return { x: lmSmooth[li].x, y: lmSmooth[li].y };
        }
        return g ? applyAff(g, { x: pt[0], y: pt[1] }) : { x: pt[0], y: pt[1] };
      });
      drawMesh(dstPts, 1);
      const gap = Math.hypot(lm[13].x - lm[14].x, lm[13].y - lm[14].y);
      const mw = Math.hypot(lm[61].x - lm[291].x, lm[61].y - lm[291].y) || 1;
      const openRaw = Math.min(1, Math.max(0, (gap / mw - 0.05) / 0.30));
      openSmooth += (openRaw - openSmooth) * 0.5;
      drawMouth(dstPts, 1, openSmooth);
      lastDstPts = dstPts;
      if (statusEl.textContent.indexOf('Live') !== 0) setStatus('Live — Mara is on you 💜');
    } else if (lastDstPts && performance.now() - lastSeen < 350) {
      const f2 = 1 - (performance.now() - lastSeen) / 350;
      drawMesh(lastDstPts, f2);
      drawMouth(lastDstPts, f2, openSmooth);
    }
    ctx.restore();
    if (faceMesh && !fmBusy && !fmFailed) {
      fmBusy = true;
      faceMesh.send({ image: video }).catch(() => { fmBusy = false; });
    }
  }
  requestAnimationFrame(drawFrame);
}

// Solve the 2x3 affine mapping (sx,sy) triples -> (dx,dy) triples.
function affineFrom(src, dst) {
  const [s1, s2, s3] = src, [d1, d2, d3] = dst;
  const denom = (s2.x - s1.x) * (s3.y - s1.y) - (s3.x - s1.x) * (s2.y - s1.y);
  if (Math.abs(denom) < 1e-6) return null;
  const a = ((d2.x - d1.x) * (s3.y - s1.y) - (d3.x - d1.x) * (s2.y - s1.y)) / denom;
  const b = ((s2.x - s1.x) * (d3.x - d1.x) - (d2.x - d1.x) * (s3.x - s1.x)) / denom;
  const c = ((d2.y - d1.y) * (s3.y - s1.y) - (d3.y - d1.y) * (s2.y - s1.y)) / denom;
  const d = ((s2.x - s1.x) * (d3.y - d1.y) - (d2.y - d1.y) * (s3.x - s1.x)) / denom;
  return { a, b, c, d, tx: d1.x - a * s1.x - b * s1.y, ty: d1.y - c * s1.x - d * s1.y };
}
const applyAff = (m, p) => ({ x: m.a * p.x + m.b * p.y + m.tx, y: m.c * p.x + m.d * p.y + m.ty });

// v2: piecewise-affine warp of Mara's texture across the face mesh.
// srcPts are her texture pixels (offline landmarks + ellipse perimeter);
// dstPts are the matching points on the user's face this frame.
function drawMesh(dstPts, fade) {
  const alpha = (strengthEl.value / 100) * fade;
  ctx.save();
  ctx.globalAlpha = alpha;
  for (const t of MESH.tris) {
    const s = [MESH.pts[t[0]], MESH.pts[t[1]], MESH.pts[t[2]]];
    const d = [dstPts[t[0]], dstPts[t[1]], dstPts[t[2]]];
    const m = affineFrom(
      s.map(p => ({ x: p[0], y: p[1] })), d);
    if (!m) continue;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(d[0].x, d[0].y); ctx.lineTo(d[1].x, d[1].y); ctx.lineTo(d[2].x, d[2].y);
    ctx.closePath(); ctx.clip();
    ctx.transform(m.a, m.c, m.b, m.d, m.tx, m.ty);
    ctx.drawImage(tex, 0, 0);
    ctx.restore();
  }
  ctx.restore();
}

// v3: mouth-region triangles re-drawn from the laughing texture, alpha per
// triangle = mouth openness x baked edge weight, so her mouth opens with yours.
function drawMouth(dstPts, fade, openAmt) {
  if (!MESH.mouthTris || openAmt <= 0.01) return;
  const base = (strengthEl.value / 100) * fade * openAmt;
  for (let k = 0; k < MESH.mouthTris.length; k++) {
    const t = MESH.tris[MESH.mouthTris[k]];
    const w = MESH.mouthW ? MESH.mouthW[k] : 1;
    if (w <= 0) continue;
    const s = [MESH.pts[t[0]], MESH.pts[t[1]], MESH.pts[t[2]]];
    const d = [dstPts[t[0]], dstPts[t[1]], dstPts[t[2]]];
    const m = affineFrom(s.map(p => ({ x: p[0], y: p[1] })), d);
    if (!m) continue;
    ctx.save();
    ctx.globalAlpha = base * w;
    ctx.beginPath();
    ctx.moveTo(d[0].x, d[0].y); ctx.lineTo(d[1].x, d[1].y); ctx.lineTo(d[2].x, d[2].y);
    ctx.closePath(); ctx.clip();
    ctx.transform(m.a, m.c, m.b, m.d, m.tx, m.ty);
    ctx.drawImage(texOpen, 0, 0);
    ctx.restore();
  }
}

// v1 fallback: single affine between eye/chin anchors.
function drawMorph(dst, fade) {
  const s = { e1:{x:SRC.e1.x*tex.naturalWidth, y:SRC.e1.y*tex.naturalHeight},
              e2:{x:SRC.e2.x*tex.naturalWidth, y:SRC.e2.y*tex.naturalHeight},
              chin:{x:SRC.chin.x*tex.naturalWidth, y:SRC.chin.y*tex.naturalHeight} };
  const m = affineFrom([s.e1, s.e2, s.chin], [dst.e1, dst.e2, dst.chin]);
  if (!m) return;
  ctx.save();
  ctx.globalAlpha = (strengthEl.value / 100) * fade;
  ctx.setTransform(-m.a, m.c, -m.b, m.d, canvas.width - m.tx, m.ty);
  ctx.drawImage(tex, 0, 0);
  ctx.restore();
}

async function startCamera() {
  setStatus('Starting camera…');
  initFaceMesh();
  if (stream) stream.getTracks().forEach(t => t.stop());
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false });
  } catch (e) {
    if (e && e.name === 'NotAllowedError')
      setStatus('Camera permission denied — allow camera for this site (browser/site settings), then tap Start again');
    else if (e && e.name === 'NotFoundError')
      setStatus('No camera found on this device');
    else
      setStatus('Camera error: ' + (e ? (e.name + ' ' + e.message) : 'unknown'));
    return;
  }
  video.srcObject = stream;
  try { await video.play(); } catch (e) { /* iOS sometimes resolves oddly; loop checks readyState */ }
  canvas.width = video.videoWidth || 960;
  canvas.height = video.videoHeight || 720;
  if (!running) { running = true; requestAnimationFrame(drawFrame); }
  flipBtn.disabled = snapBtn.disabled = recBtn.disabled = false;
  startBtn.textContent = '📷 Restart camera';
  setStatus(fmFailed ? 'Live (plain camera — tracking failed to load)' : 'Live — lining Mara up…');
}

startBtn.onclick = startCamera;
flipBtn.onclick = () => { facing = (facing === 'user') ? 'environment' : 'user'; smooth = null; latestLm = null; startCamera(); };
snapBtn.onclick = () => {
  const a = document.createElement('a');
  a.download = 'mara-filter.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
};

let recorder = null, chunks = [];
recBtn.onclick = () => {
  if (recorder) { recorder.stop(); recorder = null; recBtn.textContent = '⏺ Record'; return; }
  chunks = [];
  try {
    recorder = new MediaRecorder(canvas.captureStream(30), { mimeType: 'video/webm' });
  } catch (e) { setStatus('Recording not supported in this browser'); return; }
  recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    const a = document.createElement('a');
    a.download = 'mara-filter.webm';
    a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
    a.click();
  };
  recorder.start();
  recBtn.textContent = '⏹ Stop';
};
